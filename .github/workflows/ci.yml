name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Dependency audit (fail on critical, prod deps)
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      - name: No secrets committed
        run: |
          if git grep -nEI "sk_live_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}|sk-proj-[A-Za-z0-9_-]{20,}" -- . ':!package-lock.json'; then
            echo "Possible secret committed"; exit 1; fi
